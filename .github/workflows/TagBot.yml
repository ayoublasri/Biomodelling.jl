name: TagBot
on:
  issue_comment:               # fires when the registrator comments, instead of polling hourly
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: '3'
permissions:
  contents: write              # creates the tag and release
  actions: read
  checks: read
  issues: read
  pull-requests: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lookback: ${{ github.event.inputs.lookback }}
